version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: calendar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: calendar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: calendar-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrations:
    image: postgres:15-alpine
    container_name: calendar-migrations
    environment:
      PGPASSWORD: postgres
    volumes:
      - ../database/migrations:/migrations:ro
    command:
      - sh
      - -c
      - 'for f in /migrations/*.up.sql; do psql -h postgres -U postgres -d calendar -f "$$f" || exit 1; done'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  calendar:
    image: calendar:develop
    container_name: calendar-app
    ports:
      - "8888:8080"
    environment:
      LOGGER_LEVEL: info
      STORAGE_TYPE: sql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: calendar
      DB_SCHEMA: hwgocalendar
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: calendar-scheduler:develop
    container_name: calendar-scheduler
    ports:
      - "8081:8081"
    environment:
      LOGGER_LEVEL: info
      STORAGE_TYPE: sql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: calendar
      DB_SCHEMA: hwgocalendar
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: notifications
      KAFKA_RETRY: 30
      KAFKA_TIMEOUT: 10s
      SCHEDULER_INTERVAL: 1m
      METRICS_ADDR: :8081
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  storer:
    image: calendar-storer:develop
    container_name: calendar-storer
    ports:
      - "8082:8082"
    environment:
      LOGGER_LEVEL: info
      STORAGE_TYPE: sql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: calendar
      DB_SCHEMA: hwgocalendar
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: notifications
      KAFKA_GROUP_ID: storer
      KAFKA_RETRY: 30
      KAFKA_TIMEOUT: 10s
      METRICS_ADDR: :8082
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: calendar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - calendar
      - scheduler
      - storer
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data: