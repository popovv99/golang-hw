global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'calendar'
    static_configs:
      - targets: ['calendar:8080']

  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:8081']

  - job_name: 'storer'
    static_configs:
      - targets: ['storer:8082']
